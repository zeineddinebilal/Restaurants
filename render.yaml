# Render Blueprint for PlateFit (Personalized Menu Platform)
# Repository: https://github.com/zeineddinebilal/Restaurants
#
# Notes on Render behavior:
# 1. Database plan defaults to `basic-256mb` (Render's paid starter Postgres tier)
#    because Render's `free` Postgres tier expires and is deleted after 30 days.
#    For short-term free testing, change `plan: basic-256mb` under `databases` to `plan: free`.
# 2. Migrations run inside `startCommand` (`npx prisma migrate deploy && npm run start`)
#    rather than `preDeployCommand`, because `preDeployCommand` is only supported on paid
#    web service plans. Putting `prisma migrate deploy` in `startCommand` ensures migrations
#    always run safely before server startup on both free and paid web plans.

databases:
  - name: platefit-db
    databaseName: platefit
    user: platefit_user
    plan: basic-256mb # Switch to `free` for 30-day evaluation only (free DBs expire after 30 days)

services:
  - type: web
    name: platefit-web
    runtime: node
    plan: starter # Switch to `free` for hobby evaluation (spins down when idle)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: platefit-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXT_PUBLIC_APP_NAME
        value: PlateFit
      - key: NEXT_PUBLIC_APP_NAME_AR
        value: بليت فيت
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: DEMO_PASSWORD
        sync: false
      - key: TABLE_SESSION_TTL_HOURS
        value: "4"
