# Render Blueprint for PlateFit (Personalized Menu Platform)
# Repository: https://github.com/zeineddinebilal/Restaurants
#
# Notes on Render behavior:
# 1. Both web and database default to `plan: free` for the live demo deployment.
#    - Free web services spin down after ~15 minutes of inactivity (~1 minute cold start);
#      open the site ~1 minute before a restaurant pitch so it is warm.
#      Upgrade path for zero cold starts: `plan: starter` under `services`.
#    - Free Render PostgreSQL databases expire after 30 days.
#      Upgrade path for persistent production data: `plan: basic-256mb` under `databases`.
# 2. Free web services do not provide a Render Shell, so `startCommand` runs both
#    `npx prisma migrate deploy` and the idempotent `npm run db:seed` script automatically
#    before `npm run start`. When `SEED_DEMO=true` (and `DEMO_PASSWORD` is set), demo users
#    and the 42-dish demo menu are upserted safely on startup without duplicating rows.

databases:
  - name: platefit-db
    databaseName: platefit
    user: platefit_user
    plan: free # Upgrade to `basic-256mb` for paid persistent DB (free DB expires after 30 days)

services:
  - type: web
    name: platefit-web
    runtime: node
    plan: free # Upgrade to `starter` for always-on paid web service (no 15-min idle sleep)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run db:seed && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: platefit-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXT_PUBLIC_APP_NAME
        value: PlateFit
      - key: NEXT_PUBLIC_APP_NAME_AR
        value: بليت فيت
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_MODE
        sync: false
      - key: SEED_DEMO
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: TABLE_SESSION_TTL_HOURS
        value: "4"
